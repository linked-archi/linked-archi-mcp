name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[test]'
      - run: pytest

  # What a release publishes, built the way the release workflow builds it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine jsonschema
      - name: Build the sdist, then the wheel from it
        run: python -m build
      - run: python -m twine check --strict dist/*
      - name: server.json against the MCP Registry schema it declares
        run: python scripts/check_server_json.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The built wheel, installed into a clean environment the way a user gets it, and driven
  # from outside the checkout, so only the bundled skills can be found.
  install:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$(ls dist/*.whl)[shacl]"
      - name: Smoke test over stdio
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke.py" stdio \
            --data "$GITHUB_WORKSPACE/vendor/linked-archi-apm/fixtures/base.trig"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: linked-archi-mcp:ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install 'mcp>=2.3,<3'
      - name: Smoke test over HTTP (the image's default command)
        run: |
          docker run -d --name mcp -p 8000:8000 \
            -e LINKED_ARCHI_MCP_TOKEN=ci-token \
            -e LINKED_ARCHI_DATA=/data/base.trig \
            -v "$GITHUB_WORKSPACE/vendor/linked-archi-apm/fixtures:/data:ro" \
            linked-archi-mcp:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          python -I scripts/smoke.py http http://127.0.0.1:8000/mcp --token ci-token
      - name: Smoke test over stdio (arguments given)
        run: |
          python -I scripts/smoke.py stdio -- docker run -i --rm \
            -v "$GITHUB_WORKSPACE/vendor/linked-archi-apm/fixtures:/data:ro" \
            linked-archi-mcp:ci --data /data/base.trig
      - name: Server log
        if: always()
        run: docker logs mcp || true
