# Publishes a release when a version tag is pushed: PyPI, then the MCP Registry; the
# container image on GHCR; and a GitHub release with the built files. One-time setup and
# the per-release steps are in RELEASING.md.
#
# Nothing is published unless the build job passes: the tag matches the package version,
# the CHANGELOG section is dated, server.json is valid, and the wheel works from a clean
# install. Third-party actions are pinned to commit SHAs because these jobs hold
# publishing credentials.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The tag names the package version
        id: version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/linked_archi_mcp/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The CHANGELOG section is written and dated
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" --require-date
      - run: python -m pip install build twine jsonschema
      - name: server.json against the MCP Registry schema it declares
        run: python scripts/check_server_json.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke test the wheel from a clean install, outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$(ls dist/*.whl)[shacl]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke.py" stdio \
            --data "$GITHUB_WORKSPACE/vendor/linked-archi-apm/fixtures/base.trig"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/linked-archi-mcp/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The registry holds metadata only and verifies it against PyPI (the mcp-name marker in
  # the README), so it runs after the PyPI upload is visible.
  registry:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Wait for PyPI to serve the release
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "https://pypi.org/pypi/linked-archi-mcp/$VERSION/json" && exit 0
            sleep 10
          done
          echo "::error::PyPI does not serve linked-archi-mcp $VERSION yet"
          exit 1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to the MCP Registry (GitHub OIDC, io.github.linked-archi)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish

  github-release:
    needs: [build, pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 scripts/release_notes.py "$VERSION" --require-date > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "linked-archi-mcp $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
